<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Professor home for managing your profile, applicants, and posts.">
    <meta name="theme-color" content="#285f38">
    <title>Professor Home | Campus Research</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #d0d0d0;
        color: #fff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 280px;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .top-bar {
        height: 50px;
        flex: 0 0 50px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: #285f38;
      }

      .menu-button {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: #bcbcbc;
        color: #555;
        cursor: pointer;
      }

      .menu-button svg {
        width: 18px;
        height: 18px;
      }

      .menu-panel[hidden] {
        display: none;
      }

      .menu-panel {
        position: fixed;
        z-index: 1;
        inset: 0 0 auto;
        min-height: min(39vh, 330px);
        padding: 10px 16px 18px;
        background: #fff;
        color: #333;
      }

      .close-menu {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        background: transparent;
        color: #555;
        cursor: pointer;
      }

      .close-menu svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-width: 1.5;
      }

      .menu-heading {
        margin: 24px 0 8px;
        color: #777;
        font-size: 9px;
        font-weight: 400;
      }

      .menu-links {
        display: grid;
        gap: 4px;
      }

      .menu-link {
        min-height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        border: 0;
        border-radius: 8px;
        background: #f0f0eb;
        color: #333;
        font: inherit;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }

      .menu-link svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: #777;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.5;
      }

      .search {
        width: 100%;
        height: 22px;
        min-width: 0;
        padding: 0 10px;
        border: 0;
        border-radius: 1px;
        background: #898989;
        color: #fff;
        font: inherit;
        font-size: 10px;
      }

      .search::placeholder {
        color: #e2e2e2;
        opacity: 1;
      }

      main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #d0d0d0;
      }

      .professor-navigation {
        width: clamp(196px, 66vw, 352px);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .navigation-button {
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 10px;
        border: 0;
        background: #285f38;
        color: #f5f5f5;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .navigation-button svg {
        width: 34px;
        height: 34px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .menu-button:focus-visible,
      .close-menu:focus-visible,
      .menu-link:focus-visible,
      .navigation-button:focus-visible,
      .search:focus-visible {
        outline: 3px solid #163b23;
        outline-offset: 3px;
      }

      .navigation-button:hover {
        background: #214f2f;
      }
    </style>
  </head>
  <body>
    <header class="top-bar">
      <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="explore-menu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
        </svg>
      </button>
      <input class="search" type="search" aria-label="Search" placeholder="SEARCH">
    </header>
    <nav class="menu-panel" id="explore-menu" aria-label="Explore" hidden>
      <button class="close-menu" type="button" aria-label="Close menu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"></path>
        </svg>
      </button>
      <p class="menu-heading">EXPLORE</p>
      <div class="menu-links">
        <button class="menu-link" type="button" data-target="home">
          <span>Home</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
        </button>
        <button class="menu-link" type="button" data-target="applicants">
          <span>Applicants</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
        </button>
        <button class="menu-link" type="button" data-target="profile">
          <span>Profile</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
        </button>
        <button class="menu-link" type="button" aria-label="Log Out">
          <span>Log Out</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 4h6v16h-6M13 12H4m0 0 5-5m-5 5 5 5"></path>
          </svg>
        </button>
      </div>
    </nav>
    <main id="home" tabindex="-1">
      <nav class="professor-navigation" aria-label="Professor navigation">
        <button class="navigation-button" id="profile" type="button">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="10" r="5"></circle>
            <path d="M6 27v-3a8 8 0 0 1 8-8h4a8 8 0 0 1 8 8v3"></path>
          </svg>
          <span>Profile</span>
        </button>
        <button class="navigation-button" id="applicants" type="button">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="13.5" cy="13.5" r="8"></circle>
            <path d="m19.5 19.5 7 7"></path>
          </svg>
          <span>View Applicants</span>
        </button>
        <button class="navigation-button" type="button">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="11"></circle>
            <path d="M16 10v12M10 16h12"></path>
          </svg>
          <span>Posts</span>
        </button>
        <button class="navigation-button" type="button">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M19 5h8v22h-8M17 16h-9m0 0 6-6m-6 6 6 6"></path>
            <path d="M5 8v16"></path>
          </svg>
          <span>Log Out</span>
        </button>
      </nav>
    </main>
    <script>
      const menuButton = document.querySelector(".menu-button");
      const closeMenuButton = document.querySelector(".close-menu");
      const menu = document.querySelector("#explore-menu");

      function setMenuOpen(isOpen) {
        menu.hidden = !isOpen;
        menuButton.setAttribute("aria-expanded", String(isOpen));
        menuButton.setAttribute("aria-label", isOpen ? "Menu open" : "Open menu");
        (isOpen ? closeMenuButton : menuButton).focus();
      }

      menuButton.addEventListener("click", () => {
        setMenuOpen(menu.hidden);
      });

      closeMenuButton.addEventListener("click", () => {
        setMenuOpen(false);
      });

      menu.addEventListener("click", (event) => {
        const link = event.target.closest("[data-target]");
        if (link) {
          setMenuOpen(false);
          document.getElementById(link.dataset.target).focus();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !menu.hidden) {
          setMenuOpen(false);
        }
      });
    </script>
  </body>
</html>
