name: Messaging checks
on:
  push:
    branches: [main, student-professor-messaging]
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: campus_dev
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: campus_dev
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U campus_dev -d campus_dev"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://campus_dev:ci-local-only@127.0.0.1:55432/campus_dev
      TEST_DATABASE_URL: postgresql://campus_dev:ci-local-only@127.0.0.1:55432/campus_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:init
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run db:verify
      - name: Create isolated integration-test database
        env:
          PGPASSWORD: ci-local-only
        run: psql -h 127.0.0.1 -p 55432 -U campus_dev -d campus_dev -c 'CREATE DATABASE campus_test'
      - run: npm run test:db
      - run: python3 -m unittest discover -s tests -p 'test*uml.py' -v
